name: Terbit post Threads

on:
  schedule:
    # Setiap 30 minit. Slot 08:30, 13:00 dan 21:00 waktu Malaysia jatuh tepat pada larian ini.
    - cron: '0,30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Terbitkan post yang sampai waktunya
        id: publish
        continue-on-error: true
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: node scripts/publish.mjs

      - name: Simpan status giliran
        run: |
          if git diff --quiet -- queue/posts.json; then
            echo "Tiada perubahan."
            exit 0
          fi
          git config user.name "threads-poster"
          git config user.email "actions@users.noreply.github.com"
          git add queue/posts.json
          git commit -m "Kemas kini status giliran"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1

      - name: Tanda gagal jika ada post yang gagal
        if: steps.publish.outcome == 'failure'
        run: exit 1
